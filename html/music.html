<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="阿尧的赛博音乐站 - 带音频可视化与旋转唱片">
<title>阿尧 · 赛博音乐</title>
<link rel="icon" href="../img/avatar.jpg" type="image/jpeg">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="inner-page">
<canvas id="particles"></canvas>
<div class="scanlines"></div>
<div class="boot-screen">
  <div class="boot-logo" style="position:relative;"></div>
  <div class="boot-text">&gt; 调谐音频矩阵...</div>
  <div class="boot-bar"><div class="boot-bar-fill"></div></div>
</div>
<nav class="navbar" id="navbar">
  <a class="nav-brand" href="index.html"><img src="../img/avatar.jpg" alt="阿尧" class="nav-avatar"><span class="nav-name">阿尧</span></a>
  <ul class="nav-links">
    <li><a href="../index.html">首页</a></li>
    <li><a href="index.html">主页</a></li>
    <li><a href="gallery.html">相册</a></li>
    <li><a href="music.html" class="active">音乐</a></li>
    <li><a href="video.html">视频</a></li>
    <li><a href="tools.html">工具</a></li>
    <li><a href="contact.html">联系</a></li>
  </ul>
  <button class="theme-toggle" id="themeToggle" title="切换深色 / 浅色模式">🌙</button>
</nav>
<main class="page-main">
  <header class="page-head">
    <h1 class="section-title neon-text">赛 博 音 乐</h1>
    <p class="section-sub">戴上耳机，进入阿尧的音乐频道 🎧</p>
  </header>

  <div class="music-stage holo-card reveal">
    <div class="vinyl-wrap">
      <div class="vinyl" id="vinyl">
        <div class="vinyl-label"><img src="../img/avatar.jpg" alt="唱片封面"></div>
      </div>
    </div>
    <div class="music-panel">
      <h2 class="song-title neon-text" id="songTitle">我们</h2>
      <p class="song-artist" id="songArtist">阿尧的歌单</p>
      <canvas id="visualizer"></canvas>
    </div>
  </div>

  <div class="playlist holo-card reveal">
    <h3>🎧 播放列表（点击播放）</h3>
    <ul id="playlist">
      <li class="pl-item active" data-index="0"><span class="pl-num">01</span><span class="pl-name">我们</span></li>
      <li class="pl-item" data-index="1"><span class="pl-num">02</span><span class="pl-name">我们的明天</span></li>
      <li class="pl-item" data-index="2"><span class="pl-num">03</span><span class="pl-name">第57次取消发送</span></li>
    </ul>
  </div>
</main>
<footer class="site-footer">
  <p>© 2026 杨应尧 (阿尧) · 网络安全爱好者 · 赛博空间 | 微信 yyy_20080711 · QQ 3925595683</p>
</footer>

<div id="music-player" class="music-player" data-music-prefix="../">
  <div class="mp-bar">
    <button class="mp-btn" id="mpCollapse" title="折叠 / 展开">▾</button>
    <div class="mp-disc"><img src="../img/avatar.jpg" alt="碟片"></div>
    <div class="mp-info">
      <div class="mp-title" id="mpTitle">阿尧的音乐站</div>
      <div class="mp-artist" id="mpArtist">点击播放</div>
    </div>
    <button class="mp-btn" id="mpPrev" title="上一首">⏮</button>
    <button class="mp-btn mp-play-btn" id="mpPlay" title="播放 / 暂停">▶</button>
    <button class="mp-btn" id="mpNext" title="下一首">⏭</button>
    <div class="mp-progress"><input type="range" id="mpSeek" min="0" max="1000" value="0" title="进度"></div>
    <span class="mp-time" id="mpTime">00:00 / 00:00</span>
    <div class="mp-volume"><span>🔊</span><input type="range" id="mpVolume" min="0" max="100" value="80" title="音量"></div>
    <button class="mp-btn" id="mpMode" title="播放模式">🔁</button>
  </div>
</div>

<script src="../js/main.js"></script>
</body>
</html>
